<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Latihan Negative Values Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-8">
    <!-- Banner Utama -->
    <div class="bg-indigo-600 h-40 rounded-xl p-6 text-white">
      <h1 class="text-2xl font-bold">Halaman Profil</h1>
    </div>

    <!-- Kartu Informasi (Harus ditarik ke atas agar menimpa banner biru) -->
    <div class="-mt-12 bg-white shadow-xl rounded-xl p-6 mx-6 border border-gray-100">
      <h2 class="text-xl font-semibold text-gray-800">Nama Siswa</h2>
      <p class="text-gray-600">Kelas XI B - Rekayasa Perangkat Lunak</p>
    </div>
  </body>
</html>

<!-- Note:   
1. Penulisan kode / sintaks yang digunakan: Negative margin Tailwind (tanda mines - sebelum class), yaitu -mt-12
2. Kesimpulan / Alasan: Margin top negatif menarik posisi kartu ke atas jadinimpa sebagian banner di atasnya 
-->
